<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Brand icon library demo</title>
<style>
  body { font: 16px system-ui; margin: 20px; color: #222; }
  button { font: inherit; padding: 8px 18px; }
  iframe { width: 100%; height: 70vh; border: 1px solid #ccc; margin-top: 16px; }
  #results { font-size: 14px; }
</style>
<h1>Brand icon libraries</h1>
<p>Replay searches the existing gallery and checks exact rendered references, both Dagster themes, and an existing Lucide reference.</p>
<button id="replay">Replay</button> <strong id="status">Ready</strong>
<div id="results"></div>
<iframe id="gallery" title="Existing icon gallery" src="/?library=svg-logos&search=microsoft-power-bi"></iframe>
<script>
const steps = [
  ['svg-logos', 'microsoft-power-bi', ['microsoft-power-bi'], 'light'],
  ['svg-logos', 'aws-cloudformation', ['aws-cloudformation'], 'light'],
  ['dashboard-icons', 'dagster', ['dagster-light', 'dagster-dark'], 'light'],
  ['dashboard-icons', 'dagster', ['dagster-light', 'dagster-dark'], 'dark'],
  ['dashboard-icons', 'powerbi', ['powerbi'], 'light'],
  ['carbon-pictograms', 'ibm--cloud', ['ibm--cloud'], 'light'],
  ['lucide', 'check', ['check'], 'light']
];
const gallery = document.querySelector('#gallery');
document.querySelector('#replay').onclick = async function () {
  this.disabled = true;
  document.querySelector('#results').replaceChildren();
  try {
    for (const [library, search, names, theme] of steps) {
      document.querySelector('#status').textContent = `${library} / ${search} (${theme})`;
      await new Promise(resolve => {
        gallery.onload = resolve;
        gallery.src = `/?library=${encodeURIComponent(library)}&search=${encodeURIComponent(search)}`;
      });
      const doc = gallery.contentDocument;
      doc.documentElement.setAttribute('data-theme', theme);
      for (const name of names) {
        const reference = `${library}/${name}`;
        const svg = doc.querySelector(`[data-unmagic-icon="${reference}"]`);
        if (!svg || !svg.querySelector('path') || svg.getBoundingClientRect().width === 0) {
          throw new Error(`Missing rendered SVG: ${reference}`);
        }
      }
      const result = document.createElement('p');
      result.textContent = `PASS: ${names.map(name => `${library}/${name}`).join(', ')} (${theme})`;
      document.querySelector('#results').append(result);
      await new Promise(resolve => setTimeout(resolve, 1800));
    }
    document.querySelector('#status').textContent = 'All 7 demo steps passed';
  } catch (error) {
    document.querySelector('#status').textContent = `FAIL: ${error.message}`;
  } finally {
    this.disabled = false;
  }
};
</script>
</html>
